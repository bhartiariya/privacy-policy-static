<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Bhajan Sarovar...</title>
  <meta name="apple-itunes-app" content="app-id=6738131733">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #84090B, #A60C0E);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
    }
    .loader {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { margin-bottom: 10px; font-size: 28px; }
    .links { margin-top: 30px; }
    .links a {
      color: white;
      text-decoration: underline;
      margin: 0 10px;
      font-size: 16px;
    }
  </style>
  <script>
    (function() {
      const path = window.location.pathname;
      const appUrl = 'bhajansarovar:/' + path;
      const appStoreUrl = 'https://apps.apple.com/app/id6738131733';
      const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.bhajansarovar.app';
      
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);
      
      console.log('🔗 Path:', path);
      console.log('📱 App URL:', appUrl);
      console.log('🍎 Is iOS:', isIOS);
      console.log('🤖 Is Android:', isAndroid);
      
      // Try to open the app immediately
      if (isIOS || isAndroid) {
        console.log('⏰ Attempting to open app...');
        window.location.href = appUrl;
        
        // After 2.5 seconds, if still on page, redirect to store
        setTimeout(function() {
          if (!document.hidden) {
            console.log('📲 App did not open, redirecting to store');
            if (isIOS) {
              window.location.href = appStoreUrl;
            } else if (isAndroid) {
              window.location.href = playStoreUrl;
            }
          } else {
            console.log('✅ App opened successfully!');
          }
        }, 2500);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <h1>🎵 Bhajan Sarovar</h1>
    <div class="loader"></div>
    <p>Opening in app...</p>
    <div class="links">
      <p><small>Don't have the app?</small></p>
      <a href="https://apps.apple.com/app/id6738131733">Download for iOS</a>
      <a href="https://play.google.com/store/apps/details?id=com.bhajansarovar.app">Download for Android</a>
    </div>
  </div>
</body>
</html>
