<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Bhajan Sarovar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #FFF6E8 0%, #FFE8CC 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #84090B;
            margin: 20px 0;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(132, 9, 11, 0.2);
            border-top-color: #84090B;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎵</div>
        <h1>Redirecting to Store...</h1>
        <div class="spinner"></div>
    </div>

    <script>
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /android/i.test(userAgent);
        
        const iosAppStore = 'itms-apps://itunes.apple.com/app/id6756024795';
        const androidPlayStore = 'https://play.google.com/store/apps/details?id=com.dadiji.bhajansangrah';
        
        if (isIOS) {
            window.location.href = iosAppStore;
        } else if (isAndroid) {
            window.location.href = androidPlayStore;
        } else {
            // Desktop - show both options
            document.querySelector('h1').textContent = 'Download Bhajan Sarovar';
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('.container').innerHTML += `
                <p style="margin: 20px 0; color: #666;">Choose your platform:</p>
                <a href="${iosAppStore}" style="display: inline-block; background: #84090B; color: white; padding: 15px 30px; margin: 10px; text-decoration: none; border-radius: 12px; font-weight: 600;">
                    📱 App Store
                </a>
                <a href="${androidPlayStore}" style="display: inline-block; background: #84090B; color: white; padding: 15px 30px; margin: 10px; text-decoration: none; border-radius: 12px; font-weight: 600;">
                    📱 Play Store
                </a>
            `;
        }
    </script>
</body>
</html>
